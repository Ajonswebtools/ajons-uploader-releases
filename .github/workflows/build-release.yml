name: Build and Draft Release (manual only)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated: windows,linux,macos-intel,macos-arm64 (default windows)'
        required: false
        type: string
        default: 'windows'
      release_version:
        description: 'Release tag, e.g. v1.0.6 (required to create draft release)'
        required: false
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Parse platforms input and generate matrix
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Parse platforms input
        id: set-matrix
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'windows' }}"
          PLATFORMS=$(echo "$PLATFORMS" | sed 's/ //g')
          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="windows"
          fi
          MATRIX='{"include":[]}'
          IFS=',' read -ra PLATFORMS_ARRAY <<< "$PLATFORMS"
          for P in "${PLATFORMS_ARRAY[@]}"; do
            case "$P" in
              windows)
                MATRIX=$(echo "$MATRIX" | jq -c '.include += [{"os": "windows-latest", "target": "windows", "asset_name": "ajons-uploader-windows-x64.exe"}]')
                ;;
              linux)
                MATRIX=$(echo "$MATRIX" | jq -c '.include += [{"os": "ubuntu-latest", "target": "linux", "asset_name": "ajons-uploader-linux-x64"}]')
                ;;
              macos-intel)
                MATRIX=$(echo "$MATRIX" | jq -c '.include += [{"os": "macos-15-intel", "target": "macos-intel", "asset_name": "ajons-uploader-macos-intel"}]')
                ;;
              macos-arm64)
                MATRIX=$(echo "$MATRIX" | jq -c '.include += [{"os": "macos-latest", "target": "macos-arm64", "asset_name": "ajons-uploader-macos-arm64"}]')
                ;;
              *)
                echo "Error: unknown platform '$P'" >&2
                exit 1
                ;;
            esac
          done
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1 keyring
      - name: Build with PyInstaller
        working-directory: uploader
        run: python -m PyInstaller ajons-uploader.spec --clean
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp uploader/dist/ajons-uploader.exe artifacts/${{ matrix.asset_name }}
          else
            cp uploader/dist/ajons-uploader artifacts/${{ matrix.asset_name }}
          fi
          (cd artifacts && sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256")
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event.inputs.release_version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Verify downloaded artifacts exist and have expected names
        shell: bash
        run: |
          cd dist
          for f in ajons-uploader-windows-x64.exe ajons-uploader-linux-x64 ajons-uploader-macos-intel ajons-uploader-macos-arm64; do
            if [ ! -f "$f" ] || [ ! -s "$f" ]; then
              echo "Error: $f missing or empty in dist/"
              exit 1
            fi
            echo "OK: $f ($(stat -c%s $f) bytes)"
          done
      - name: Create checksums manifest
        shell: bash
        run: |
          cd dist
          : > SHA256SUMS
          for f in ajons-uploader-windows-x64.exe ajons-uploader-linux-x64 ajons-uploader-macos-intel ajons-uploader-macos-arm64; do
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS || true
          done
          [ -s SHA256SUMS ] || { echo "Error: SHA256SUMS empty"; exit 1; }
          sha256sum -c SHA256SUMS
      - name: Create DRAFT release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          # Fail if tag already exists
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Error: Release $VERSION already exists"
            exit 1
          fi
          FILES=(dist/SHA256SUMS)
          for f in ajons-uploader-windows-x64.exe ajons-uploader-linux-x64 ajons-uploader-macos-intel ajons-uploader-macos-arm64; do
            [ -f "dist/$f" ] && FILES+=("dist/$f")
          done
          gh release create "$VERSION" \
            --title "Ajons Uploader $VERSION" \
            --notes "${{ github.event.inputs.release_notes || 'Draft release - review before publishing' }}" \
            --draft \
            --target "${{ github.sha }}" \
            "${FILES[@]}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/*
